name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows matches the machine the phase gates were run on.
    runs-on: windows-latest
    steps:
      # Check out the exact bytes (LF) the hash manifests were written against.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # GitHub's runners have no OpenGL, so the six tests that render camera images
      # (and the doctor check that includes rendering) run locally only.
      - run: >-
          uv run --locked pytest -q
          --deselect tests/test_cli.py::test_doctor_passes
          --deselect tests/test_cli.py::test_render_writes_the_camera_images
          --deselect tests/test_render.py
