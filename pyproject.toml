[project]
name = "physical-ai-lab"
version = "0.1.0"
description = "MuJoCo Franka Panda push experiment with hidden mass and friction: reproducible simulation, gated phases, sealed benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.14.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
]

[project.scripts]
physical-ai-lab = "physical_ai_lab.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The project folder is synced by OneDrive; copying avoids hardlinks from the uv cache.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
